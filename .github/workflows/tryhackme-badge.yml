name: Update TryHackMe Badge

# Fetches the TryHackMe badge and commits it into the repo so it renders
# reliably (GitHub's image proxy often refuses the external S3 badge).
# Uses only the official actions/checkout and plain shell. No third-party actions.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit the updated badge

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TryHackMe badge
        run: |
          mkdir -p assets
          curl -fsSL "https://tryhackme-badges.s3.amazonaws.com/laminate.png" \
            -o assets/tryhackme-badge.png
          # Validate it is a real PNG before committing; fail loudly otherwise.
          if ! file assets/tryhackme-badge.png | grep -qi 'PNG image'; then
            echo "Downloaded file is not a valid PNG. Check the TryHackMe badge URL/username."
            exit 1
          fi

      - name: Commit badge if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tryhackme-badge.png
          if git diff --cached --quiet; then
            echo "No change in badge."
          else
            git commit -m "Update TryHackMe badge"
            git push
          fi
